<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OtelServer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; color: #222; background: #fafafa; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    h2 { font-size: 16px; margin: 20px 0 6px; }
    .summary span { display: inline-block; margin-right: 16px; }
    table { border-collapse: collapse; width: 100%; background: #fff; font-size: 12px; }
    th, td { border: 1px solid #ddd; padding: 4px 6px; text-align: left; vertical-align: top; }
    th { background: #eef; }
    td.mono { font-family: Consolas, monospace; white-space: nowrap; }
    td.attr { color: #666; word-break: break-all; }
    .ERROR, .FATAL { color: #c00; font-weight: bold; }
    .WARN { color: #b60; font-weight: bold; }
  </style>
</head>
<body>
  <h1>OtelServer</h1>
  <div class="summary" id="summary">読み込み中...</div>

  <h2>ログ</h2>
  <table><thead><tr><th>時刻</th><th>端末</th><th>レベル</th><th>本文</th><th>属性</th></tr></thead><tbody id="logs"></tbody></table>

  <h2>スパン (トレース)</h2>
  <table><thead><tr><th>開始</th><th>端末</th><th>名前</th><th>所要 (ms)</th><th>状態</th><th>trace / span / parent</th><th>属性</th></tr></thead><tbody id="spans"></tbody></table>

  <h2>メトリクス</h2>
  <table><thead><tr><th>時刻</th><th>端末</th><th>名前</th><th>種別</th><th>値</th><th>属性</th></tr></thead><tbody id="metrics"></tbody></table>

  <script>
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]));
    const time = s => new Date(s).toLocaleTimeString("ja-JP", { hour12: false }) + "." + String(new Date(s).getMilliseconds()).padStart(3, "0");
    // 長い値 (例外のスタックトレースなど) は切り詰め、全文はツールチップで見せる
    const attrs = a => Object.entries(a ?? {}).map(([k, v]) => {
      const text = String(v ?? "");
      return text.length > 160 ? `<span title="${esc(text)}">${esc(k)}=${esc(text.slice(0, 160))}…</span>` : `${esc(k)}=${esc(text)}`;
    }).join(" ");
    const limit = 60;

    async function refresh() {
      try {
        const [summary, logs, spans, metrics] = await Promise.all(
          ["/api/summary", "/api/logs", "/api/spans", "/api/metrics"].map(u => fetch(u).then(r => r.json())));
        document.getElementById("summary").innerHTML =
          `<span>ログ <b>${summary.logs}</b></span><span>スパン <b>${summary.spans}</b></span><span>メトリクス <b>${summary.metrics}</b></span>` +
          `<span>受信バッチ <b>${summary.batches}</b></span><span>最終受信 <b>${summary.lastReceived ? time(summary.lastReceived) : "-"}</b></span>` +
          `<span>端末 <b>${esc(summary.devices.join(", ") || "-")}</b></span>`;
        document.getElementById("logs").innerHTML = logs.slice(0, limit).map(x =>
          `<tr><td class="mono">${time(x.time)}</td><td class="mono">${esc(x.device)}</td><td class="${esc(x.severity)}">${esc(x.severity)}</td><td>${esc(x.body)}</td><td class="attr">${attrs(x.attributes)}</td></tr>`).join("");
        document.getElementById("spans").innerHTML = spans.slice(0, limit).map(x =>
          `<tr><td class="mono">${time(x.time)}</td><td class="mono">${esc(x.device)}</td><td>${esc(x.name)}</td><td class="mono">${x.durationMs.toFixed(1)}</td><td>${esc(x.status)}</td>` +
          `<td class="mono">${esc(x.traceId.slice(0, 8))} / ${esc(x.spanId)} / ${esc(x.parentSpanId ?? "-")}</td><td class="attr">${attrs(x.attributes)}</td></tr>`).join("");
        document.getElementById("metrics").innerHTML = metrics.slice(0, limit).map(x =>
          `<tr><td class="mono">${time(x.time)}</td><td class="mono">${esc(x.device)}</td><td>${esc(x.name)}${x.unit ? " (" + esc(x.unit) + ")" : ""}</td><td>${esc(x.type)}</td><td class="mono">${esc(x.value)}</td><td class="attr">${attrs(x.attributes)}</td></tr>`).join("");
      } catch (e) {
        document.getElementById("summary").textContent = "取得失敗: " + e;
      }
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
